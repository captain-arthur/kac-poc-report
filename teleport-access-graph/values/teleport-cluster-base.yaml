# Base teleport-cluster values used by this repo's local POC (CE evidence).
# Enterprise license must be provided separately for Identity Security.
# See scripts/install-offline.sh for license secret handling.

clusterName: teleport.local
chartMode: standalone
proxyListenerMode: multiplex

service:
  type: ClusterIP

acme: false

highAvailability:
  replicaCount: 1

persistence:
  enabled: true
  size: 2Gi

log:
  level: INFO
  output: stdout
  format: json

# Enterprise: set licenseSecretName to an existing secret with key "license.pem"
# licenseSecretName: "license"
