# 같은 ns `teleport` 에 설치
#
# helm install teleport-access-graph ./charts/teleport-access-graph \
#   -n teleport -f ol-values.yaml
#
# clusterHostCAs: 아래 REPLACE 를 Host CA PEM 으로 교체할 것

replicaCount: 1

postgres:
  connectionString: "postgres://access_graph:access_graph@tag-postgres:5432/access_graph?sslmode=disable"

tls:
  existingSecretName: "teleport-access-graph-tls"

clusterHostCAs:
  - |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_TELEPORT_HOST_CA
    -----END CERTIFICATE-----

image:
  repository: qlqjs90/access-graph
  tag: "1.30.2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  grpcPort: 443

log:
  level: INFO

identityActivityCenter:
  enabled: false
