# Minimal PostgreSQL for Access Graph POC only (NOT production).
# Creates DB/user via POSTGRES_* env. Data on emptyDir (ephemeral).
#
#   kubectl apply -f manifests/postgres-poc.yaml
#
# Connection URI (same ns as Access Graph):
#   postgres://access_graph:access_graph@teleport-access-graph-postgres:5432/access_graph?sslmode=disable
---
apiVersion: v1
kind: Namespace
metadata:
  name: teleport-access-graph
---
apiVersion: v1
kind: Secret
metadata:
  name: teleport-access-graph-postgres-creds
  namespace: teleport-access-graph
type: Opaque
stringData:
  POSTGRES_USER: access_graph
  POSTGRES_PASSWORD: access_graph
  POSTGRES_DB: access_graph
  uri: "postgres://access_graph:access_graph@teleport-access-graph-postgres:5432/access_graph?sslmode=disable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleport-access-graph-postgres
  namespace: teleport-access-graph
  labels:
    app: teleport-access-graph-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teleport-access-graph-postgres
  template:
    metadata:
      labels:
        app: teleport-access-graph-postgres
    spec:
      containers:
        - name: postgres
          image: qlqjs90/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: teleport-access-graph-postgres-creds
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "access_graph", "-d", "access_graph"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: teleport-access-graph-postgres
  namespace: teleport-access-graph
spec:
  selector:
    app: teleport-access-graph-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
