# Teleport role: allow Identity Security / Graph Explorer UI.
# Apply inside auth pod:
#   kubectl -n teleport exec -i "$AUTH" -- tctl create -f - < manifests/access-graph-reader-role.yaml
kind: role
version: v7
metadata:
  name: access-graph-reader
spec:
  allow:
    rules:
      - resources:
          - access_graph
        verbs:
          - list
          - read
