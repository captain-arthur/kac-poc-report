kind: role
version: v7
metadata:
  name: payments-ns-viewer
  description: "payments ns viewer (group team-payments-viewer)"
spec:
  allow:
    kubernetes_labels:
      "*": "*"
    kubernetes_groups:
      - team-payments-viewer
    kubernetes_resources:
      - kind: "*"
        namespace: payments
        name: "*"
        verbs: ["get", "list", "watch"]
  options:
    max_session_ttl: 8h
