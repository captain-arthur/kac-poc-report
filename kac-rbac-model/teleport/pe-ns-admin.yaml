kind: role
version: v7
metadata:
  name: pe-ns-admin
  description: "pe ns admin (group team-pe-admin)"
spec:
  allow:
    kubernetes_labels:
      "*": "*"
    kubernetes_groups:
      - team-pe-admin
    kubernetes_resources:
      - kind: "*"
        namespace: pe
        name: "*"
        verbs: ["get", "list", "watch", "create", "update", "patch"]
  options:
    max_session_ttl: 8h
