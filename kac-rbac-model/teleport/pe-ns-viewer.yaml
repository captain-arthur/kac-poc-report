kind: role
version: v7
metadata:
  name: pe-ns-viewer
  description: "pe ns viewer (group team-pe-viewer)"
spec:
  allow:
    kubernetes_labels:
      "*": "*"
    kubernetes_groups:
      - team-pe-viewer
    kubernetes_resources:
      - kind: "*"
        namespace: pe
        name: "*"
        verbs: ["get", "list", "watch"]
  options:
    max_session_ttl: 8h
