# Test-only copies of KAC ClusterRoles and bindings.
# Apply out of band; the k6 scenario only runs can-i against what is already there.
apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    app.kubernetes.io/part-of: kac-rbac-test
---
apiVersion: v1
kind: Namespace
metadata:
  name: pe
  labels:
    app.kubernetes.io/part-of: kac-rbac-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: t-rbac-kac-ns-viewer
  labels:
    app.kubernetes.io/part-of: kac-rbac-test
rules:
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - authentication.k8s.io
      - authorization.k8s.io
      - autoscaling
      - batch
      - certificates.k8s.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - flowcontrol.apiserver.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - policy
      - rbac.authorization.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - bindings
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - namespaces/finalize
      - namespaces/status
      - nodes
      - nodes/proxy
      - nodes/status
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - persistentvolumes
      - persistentvolumes/status
      - pods
      - pods/attach
      - pods/binding
      - pods/ephemeralcontainers
      - pods/eviction
      - pods/exec
      - pods/log
      - pods/portforward
      - pods/proxy
      - pods/status
      - podtemplates
      - replicationcontrollers
      - replicationcontrollers/scale
      - replicationcontrollers/status
      - resourcequotas
      - resourcequotas/status
      - serviceaccounts
      - serviceaccounts/token
      - services
      - services/proxy
      - services/status
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: t-rbac-kac-ns-admin
  labels:
    app.kubernetes.io/part-of: kac-rbac-test
rules:
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - authentication.k8s.io
      - authorization.k8s.io
      - autoscaling
      - batch
      - certificates.k8s.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - flowcontrol.apiserver.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - policy
      - rbac.authorization.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources:
      - bindings
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - namespaces/finalize
      - namespaces/status
      - nodes
      - nodes/proxy
      - nodes/status
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - persistentvolumes
      - persistentvolumes/status
      - pods
      - pods/attach
      - pods/binding
      - pods/ephemeralcontainers
      - pods/eviction
      - pods/log
      - pods/proxy
      - pods/status
      - podtemplates
      - replicationcontrollers
      - replicationcontrollers/scale
      - replicationcontrollers/status
      - resourcequotas
      - resourcequotas/status
      - secrets
      - serviceaccounts
      - serviceaccounts/token
      - services
      - services/proxy
      - services/status
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: t-rbac-kac-cluster-admin
  labels:
    app.kubernetes.io/part-of: kac-rbac-test
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: t-rbac-kac-cluster-admin
  labels:
    app.kubernetes.io/part-of: kac-rbac-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: t-rbac-kac-cluster-admin
subjects:
  - kind: Group
    name: t-rbac-kac-cluster-admin
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: t-rbac-kac-ns-admin
  namespace: payments
  labels:
    app.kubernetes.io/part-of: kac-rbac-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: t-rbac-kac-ns-admin
subjects:
  - kind: Group
    name: t-rbac-kac-ns-admin
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: t-rbac-kac-ns-viewer
  namespace: payments
  labels:
    app.kubernetes.io/part-of: kac-rbac-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: t-rbac-kac-ns-viewer
subjects:
  - kind: Group
    name: t-rbac-kac-ns-viewer
    apiGroup: rbac.authorization.k8s.io
