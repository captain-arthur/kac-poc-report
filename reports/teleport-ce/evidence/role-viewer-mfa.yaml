kind: role
version: v8
metadata:
  name: kac-dev-viewer
spec:
  allow:
    kubernetes_labels:
      '*': '*'
    kubernetes_groups: ["kac-view"]
    kubernetes_resources:
      - kind: "*"
        api_group: "*"
        namespace: "dev"
        name: "*"
        verbs: ["get", "list", "watch"]
  options:
    max_session_ttl: 8h
    require_session_mfa: true
